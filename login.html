<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk / Daftar — FVGSTORE V84</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 20% 10%,#6828a955,transparent 60%),#10051f;color:#f7f0ff;font:15px system-ui,Arial,sans-serif}header{padding:17px 20px;border-bottom:1px solid #ffffff24;background:#160a2a}a{color:#d8b4fe;text-decoration:none}.wrap{max-width:460px;margin:30px auto;padding:0 16px}.panel{background:#211034;border:1px solid #9d5fe377;border-radius:20px;padding:24px;box-shadow:0 20px 55px #0007}h1{font-size:24px;margin:0 0 8px}p{color:#c8b5dd;line-height:1.6}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1}.tabs button.active{background:#873ce0}button{border:1px solid #8b5cf6;border-radius:11px;background:#382052;color:white;padding:12px;font:inherit;font-weight:700;cursor:pointer}label{display:block;margin:13px 0 6px}input{display:block;width:100%;background:#100a20;border:1px solid #8152b0;border-radius:10px;color:white;padding:13px;font:inherit}.primary{width:100%;margin-top:20px;background:linear-gradient(110deg,#7c3aed,#a855f7)}.secondary{width:100%;margin-top:10px;background:transparent}#status{white-space:pre-wrap;min-height:22px;font-size:13px;color:#fde68a;margin-top:14px}#member{display:none}button:disabled{opacity:.5}
</style></head><body><header><a href="index.html">← Kembali ke FVGSTORE💎</a></header><main class="wrap"><section class="panel"><h1>Akun FVGSTORE 💎</h1><p>Masuk atau buat akun untuk menggunakan layanan pelanggan.</p><div id="guest"><div class="tabs"><button id="tabLogin" type="button" class="active">Masuk</button><button id="tabSignup" type="button">Daftar</button></div><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="nama@email.com"><label for="password">Password (minimal 6 karakter)</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Masukkan password"><button class="primary" id="submit" type="submit">Masuk</button></form><button class="secondary" id="reset" type="button">Lupa password?</button></div><div id="member"><p>Sudah masuk sebagai <strong id="memberEmail"></strong></p><a href="index.html">Kembali ke website</a><button class="secondary" id="logout" type="button">Keluar</button></div><div id="status" role="status" aria-live="polite"></div></section></main><script>
'use strict';
const URL='https://hzzemxlhzvhssqlgdiuz.supabase.co';
const KEY_STORAGE='fvgstore_supabase_publishable';
const SESSION_STORAGE='fvgstore_customer_session_v1';
const $=id=>document.getElementById(id);
let mode='login';
function status(t){$('status').textContent=t}
function key(){try{return localStorage.getItem(KEY_STORAGE)||''}catch{return ''}}
function tab(m){mode=m;$('tabLogin').classList.toggle('active',m==='login');$('tabSignup').classList.toggle('active',m==='signup');$('submit').textContent=m==='login'?'Masuk':'Daftar';$('password').autocomplete=m==='login'?'current-password':'new-password';status('')}
async function request(path,body,token){const k=key();if(!k)throw Error('Publishable Key belum tersimpan di website GitHub ini. Buka Pengaturan Supabase pada halaman utama, isi key, lalu Simpan.');const r=await fetch(URL+'/auth/v1/'+path,{method:'POST',headers:{'Content-Type':'application/json',apikey:k,...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.error_description||d.message||d.error||'Gagal ('+r.status+')');return d}
function render(data){const logged=!!data?.user;$('guest').style.display=logged?'none':'block';$('member').style.display=logged?'block':'none';$('memberEmail').textContent=logged?data.user.email||'Pengguna':''}
$('tabLogin').onclick=()=>tab('login');$('tabSignup').onclick=()=>tab('signup');
$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit');b.disabled=true;status('Menghubungkan ke Supabase...');try{const email=$('email').value.trim(),password=$('password').value;const d=await request(mode==='login'?'token?grant_type=password':'signup',{email,password});if(d.access_token&&d.refresh_token&&d.user){localStorage.setItem(SESSION_STORAGE,JSON.stringify(d));render(d);status('Berhasil masuk! Silakan kembali ke FVGSTORE.')}else{status('Pendaftaran diterima. Jika verifikasi email diaktifkan, periksa email untuk konfirmasi sebelum masuk.')}}catch(err){status(err.message)}finally{b.disabled=false}};
$('reset').onclick=async()=>{const email=$('email').value.trim();if(!email){status('Isi email terlebih dahulu.');return}try{await request('recover',{email});status('Jika email terdaftar, tautan pemulihan akan dikirim.')}catch(err){status(err.message)}};
$('logout').onclick=async()=>{let d=null;try{d=JSON.parse(localStorage.getItem(SESSION_STORAGE)||'null')}catch{}try{if(d?.access_token)await request('logout',{},d.access_token)}catch{}localStorage.removeItem(SESSION_STORAGE);render(null);status('Sudah keluar dari akun.')};
try{render(JSON.parse(localStorage.getItem(SESSION_STORAGE)||'null'))}catch{render(null)}
</script></body></html>
